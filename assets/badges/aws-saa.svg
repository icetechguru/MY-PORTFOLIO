<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGradSAA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142132"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    
    <!-- Associate Blue Bezel Gradient -->
    <linearGradient id="borderGradSAA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Accent Ribbon Gradient -->
    <linearGradient id="ribbonGradSAA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Associate Level Pill Gradient -->
    <linearGradient id="levelGradSAA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadowSAA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#badgeShadowSAA)">
    <path d="M 160 16 
             L 288 64 
             L 288 214 
             C 288 288, 160 348, 160 364 
             C 160 348, 32 288, 32 214 
             L 32 64 Z" 
          fill="url(#borderGradSAA)" />

    <path d="M 160 26 
             L 278 70 
             L 278 210 
             C 278 278, 160 334, 160 348 
             C 160 334, 42 278, 42 210 
             L 42 70 Z" 
          fill="url(#shieldGradSAA)" />
  </g>

  <!-- Facet Highlight Lines -->
  <path d="M 160 26 L 160 348" stroke="rgba(56,189,248,0.12)" stroke-width="2"/>
  <path d="M 42 70 L 160 145 L 278 70" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>

  <!-- Top AWS Text & Smile -->
  <g transform="translate(160, 68)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="3">
      aws
    </text>
    <path d="M -26 12 Q 0 24 26 12" stroke="#FF9900" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 23 8 L 27 12 L 23 15 Z" fill="#FF9900"/>
  </g>

  <!-- Banner Ribbon: CERTIFIED -->
  <g transform="translate(160, 134)">
    <rect x="-105" y="-18" width="210" height="34" rx="6" fill="url(#ribbonGradSAA)" stroke="#7DD3FC" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="4">
      CERTIFIED
    </text>
  </g>

  <!-- Center Certification Icon: Architecture Isometric Cube -->
  <g transform="translate(160, 195)">
    <circle cx="0" cy="0" r="32" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 0 -14 L 14 -6 L 14 10 L 0 18 L -14 10 L -14 -6 Z" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 0 -14 L 0 18" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 0 2 L 14 -6" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 0 2 L -14 -6" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Certification Title -->
  <g transform="translate(160, 256)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="0.5">
      SOLUTIONS
    </text>
    <text text-anchor="middle" y="20" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" fill="#BAE6FD" letter-spacing="0.5">
      ARCHITECT
    </text>
  </g>

  <!-- Bottom Ribbon: Level (ASSOCIATE) -->
  <g transform="translate(160, 316)">
    <rect x="-75" y="-14" width="150" height="26" rx="13" fill="url(#levelGradSAA)" stroke="#E0F2FE" stroke-width="1.5"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="12" fill="#082F49" letter-spacing="2.5">
      ASSOCIATE
    </text>
  </g>
</svg>
