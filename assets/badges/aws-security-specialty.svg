<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGradSEC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1126"/>
      <stop offset="50%" stop-color="#190A17"/>
      <stop offset="100%" stop-color="#0E050D"/>
    </linearGradient>
    
    <!-- Specialty Crimson/Purple Bezel Gradient -->
    <linearGradient id="borderGradSEC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="35%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    
    <!-- Accent Ribbon Gradient -->
    <linearGradient id="ribbonGradSEC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Specialty Level Pill Gradient -->
    <linearGradient id="levelGradSEC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadowSEC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#badgeShadowSEC)">
    <path d="M 160 16 
             L 288 64 
             L 288 214 
             C 288 288, 160 348, 160 364 
             C 160 348, 32 288, 32 214 
             L 32 64 Z" 
          fill="url(#borderGradSEC)" />

    <path d="M 160 26 
             L 278 70 
             L 278 210 
             C 278 278, 160 334, 160 348 
             C 160 334, 42 278, 42 210 
             L 42 70 Z" 
          fill="url(#shieldGradSEC)" />
  </g>

  <!-- Facet Highlight Lines -->
  <path d="M 160 26 L 160 348" stroke="rgba(251,113,133,0.15)" stroke-width="2"/>
  <path d="M 42 70 L 160 145 L 278 70" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>

  <!-- Top AWS Text & Smile -->
  <g transform="translate(160, 68)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="3">
      aws
    </text>
    <path d="M -26 12 Q 0 24 26 12" stroke="#FF9900" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 23 8 L 27 12 L 23 15 Z" fill="#FF9900"/>
  </g>

  <!-- Banner Ribbon: CERTIFIED -->
  <g transform="translate(160, 134)">
    <rect x="-105" y="-18" width="210" height="34" rx="6" fill="url(#ribbonGradSEC)" stroke="#FDA4AF" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="4">
      CERTIFIED
    </text>
  </g>

  <!-- Center Certification Icon: Shield & Padlock -->
  <g transform="translate(160, 195)">
    <circle cx="0" cy="0" r="32" fill="#4C0519" stroke="#FB7185" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-10" y="-4" width="20" height="16" rx="3" fill="#FB7185"/>
    <path d="M -6 -4 L -6 -10 C -6 -13 6 -13 6 -10 L 6 -4" fill="none" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="3" r="2.5" fill="#4C0519"/>
    <path d="M 0 5.5 L 0 8.5" stroke="#4C0519" stroke-width="1.5"/>
  </g>

  <!-- Certification Title -->
  <g transform="translate(160, 256)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" letter-spacing="1">
      SECURITY
    </text>
    <text text-anchor="middle" y="19" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="13" fill="#FECDD3" letter-spacing="2">
      SPECIALTY
    </text>
  </g>

  <!-- Bottom Ribbon: Level (SPECIALTY) -->
  <g transform="translate(160, 316)">
    <rect x="-75" y="-14" width="150" height="26" rx="13" fill="url(#levelGradSEC)" stroke="#FFE4E6" stroke-width="1.5"/>
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="12" fill="#4C0519" letter-spacing="2.5">
      SPECIALTY
    </text>
  </g>
</svg>
